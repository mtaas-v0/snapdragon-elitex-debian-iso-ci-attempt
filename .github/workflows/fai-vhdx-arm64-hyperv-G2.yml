name: Build Hyper-V Gen2 AArch64 Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-image:
    # Use native ARM64 execution environment
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FAI Environment Configuration
        run: |
          mkdir -p fai-config/{class,disk_config,package_config,files/etc/apt/sources.list}
          
          # 1. Define active building profiles/classes
          echo "DEFAULT DEBIAN ARM64 UEFI CLOUD HYPERV_GEN2" > fai-config/class/50-host-classes
          
          # 1. Define active building profiles/classes
          # DEBIAN = OS, ARM64 = Arch, UEFI = Boot type, CLOUD = Cloud-init/Hyper-V hooks
          echo "DEFAULT DEBIAN ARM64 UEFI CLOUD" > fai-config/class/50-host-classes
          
          # Force Gen2 Hyper-V partition mapping (Clean FAI compatible syntax)
          cat << 'EOF' > fai-config/disk_config/HYPERV_GEN2
          disk_config disk1 disklabel:gpt fstabkey:uuid align-at:4M
          primary /boot/efi  512M   vfat   rw,noatime,umask=0077
          primary /          4G-    ext4   rw,noatime
          EOF

          # 3. Create a target-specific package source file strictly for the Debian Guest
          # The filename matches the target class 'DEBIAN'
          cat << 'EOF' | tr -d '\r' > fai-config/files/etc/apt/sources.list/DEBIAN
          deb http://deb.debian.org/debian sid main non-free-firmware
          deb-src http://deb.debian.org/debian sid main non-free-firmware
          EOF
          
          # 3. Choose the required ARM64 packages
          cat << 'EOF' > fai-config/package_config/CLOUD
          PACKAGES install
          linux-image-cloud-arm64
          cloud-init
          cloud-initramfs-growroot
          openssh-server
          grub-efi-arm64
          # grub-efi-arm64-bin
          EOF

      - name: Debug Disk Config Hex Output
        run: |
          echo "=== HEX DUMP OF HYPERV_GEN2 ==="
          xxd fai-config/disk_config/HYPERV_GEN2 || hexdump -C fai-config/disk_config/HYPERV_GEN2

      - name: Install Build and Virtualization Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fai-server \
            fai-client \
            fai-setup-storage \
            qemu-utils \
            dosfstools \
            parted \
            gdisk


      - name: Execute FAI Disk Image Builder
        continue-on-error: true
        run: |
          # Generate a raw disk file natively mapped to the AArch64 configuration space
          echo "::group::fai-diskimage --help"
          fai-diskimage --help
          echo "::endgroup::"
          
          echo "::group::FAI Bootstrapping and Disk Image Compilation Logs"
          sudo \
            FAI_FLAGS="update" \
            FAI_DEBOOTSTRAP="sid http://deb.debian.org/debian" \
            FAI_DEBOOTSTRAP_OPTS="--arch arm64 --include=apt" \
            fai-diskimage \
            --verbose \
            --size 10G \
            --class DEFAULT,DEBIAN,ARM64,UEFI,CLOUD,HYPERV_GEN2 \
            -s file://${{ github.workspace }}/fai-config \
            output-arm64-gen2.vhdx
          echo "::endgroup::"
            
      - name: Cat Hidden FAI Failure Logs
        if: failure()  # Runs ONLY if the step above exits with status 1
        run: |
          echo "=== EXTRACTING HIDDEN INTERNAL FAI LOG ENGINES ==="
          # Locate the active logging pool directory and print the primary error logs
          sudo tail -n 100 /var/log/fai/localhost/last-install/fai.log || true
          echo "=== INDIVIDUAL SUB-TASK ERRORS ==="
          sudo head -n 50 /var/log/fai/localhost/last-install/error.log || true
          
      - name: Convert Raw Image to Fixed Hyper-V VHD Format
        if: false
        run: |
          # Hyper-V Gen2 supports VHD and VHDX. 
          # For cross-platform Azure compatibility, convert it to a FIXED-size VHD format.
          qemu-img convert -f raw -O vpc -o subformat=fixed fai-aarch64-raw.img output-arm64-gen2.vhd

      - name: show cwd
        if: always()
        run: |
          ls -la
        
      - name: Upload Finished Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-aarch64-gen2-vhd-${{ github.run_number }}
          path: output-arm64-gen2.vhdx
          if-no-files-found: error
