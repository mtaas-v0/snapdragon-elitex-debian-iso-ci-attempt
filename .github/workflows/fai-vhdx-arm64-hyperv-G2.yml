name: Build Hyper-V Gen2 AArch64 Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-image:
    # Use native ARM64 execution environment
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FAI Environment Configuration
        run: |
          mkdir -p fai-config/{class,disk_config,package_config,files/etc/apt/sources.list}
          
          # 1. Define active building profiles/classes
          echo "DEFAULT DEBIAN ARM64 UEFI CLOUD HYPERV_GEN2" > fai-config/class/50-host-classes
          
          # 1. Define active building profiles/classes
          # DEBIAN = OS, ARM64 = Arch, UEFI = Boot type, CLOUD = Cloud-init/Hyper-V hooks
          echo "DEFAULT DEBIAN ARM64 UEFI CLOUD" > fai-config/class/50-host-classes
          
          # Force Gen2 Hyper-V partition mapping (Clean FAI compatible syntax)
          cat << 'EOF' > fai-config/disk_config/HYPERV_GEN2
          disk_config disk1 disklabel:gpt fstabkey:uuid align-at:4M
          primary /boot/efi  512M   vfat   rw,noatime,umask=0077
          primary /          4G-    ext4   rw,noatime
          EOF

          # 3. Create a target-specific package source file strictly for the Debian Guest
          # The filename matches the target class 'DEBIAN'
          cat << 'EOF' | tr -d '\r' > fai-config/files/etc/apt/sources.list/DEBIAN
          deb http://deb.debian.org/debian sid main non-free-firmware
          deb-src http://deb.debian.org/debian sid main non-free-firmware
          EOF
          
          # 3. Choose the required ARM64 packages
          cat << 'EOF' > fai-config/package_config/CLOUD
          PACKAGES install
          linux-image-cloud-arm64
          cloud-init
          cloud-initramfs-growroot
          openssh-server
          # grub-efi-arm64
          grub-efi-arm64-bin
          EOF

          # 5. Create a robust hook to populate the UEFI ARM64 GRUB binary
          mkdir -p fai-config/hooks
          cat << 'EOF' | tr -d '\r' > fai-config/hooks/instsoft.CLOUD
          #!/bin/bash
          
          # ==========================================
          # CANARY MARKER: Positive Confirmation Logs
          # ==========================================
          echo "##################################################"
          echo "👉 SUCCESS: THE CLOUD INSTSOFT HOOK WAS TRIGGERED! 👈"
          echo "Host Workspace: $(pwd)"
          echo "Target Root Dir: $FAI_ROOT"
          echo "##################################################"
          
          echo "=== PREPARING VIRTUAL FILESYSTEMS FOR CHROOT GRUB ==="
          
          # Explicitly mount essential host kernel devices into the chroot space
          mount --bind /dev  $FAI_ROOT/dev
          mount --bind /proc $FAI_ROOT/proc
          mount --bind /sys  $FAI_ROOT/sys
          
          echo "=== RUNNING HEADLESS REMOVABLE GRUB INSTALLATION ==="
          # Execute the bootloader compilation safely inside the isolated target paths
          chroot $FAI_ROOT grub-install \
            --target=arm64-efi \
            --no-nvram \
            --removable \
            --efi-directory=/boot/efi
          
          # Compile the final menu config mapping out the dynamic drive UUIDs
          chroot $FAI_ROOT grub-mkconfig -o /boot/grub/grub.cfg
                    
          # ==========================================
          # EFI CONTENT CHECK: Confirm files are written
          # ==========================================
          echo "=== VERIFYING EFI CONTENT INSIDE GUEST SPACE ==="
          if [ -f "$FAI_ROOT/boot/efi/EFI/BOOT/bootaa64.efi" ]; then
            echo "✅ SUCCESS: bootaa64.efi successfully written to guest EFI partition!"
          else
            echo "❌ ERROR: EFI partition is STILL empty inside the guest filesystem!"
            echo "Listing contents of $FAI_ROOT/boot/efi:"
            ls -laR $FAI_ROOT/boot/efi
          fi

          echo "=== CLEANING UP MOUNT POINTS ==="
          # Unmount the host filesystems so FAI can cleanly finalize and unloop the disk image
          umount $FAI_ROOT/dev
          umount $FAI_ROOT/proc
          umount $FAI_ROOT/sys
          EOF
          
          chmod +x fai-config/hooks/instsoft.CLOUD

      - name: Debug Disk Config Hex Output
        run: |
          echo "=== HEX DUMP OF HYPERV_GEN2 ==="
          xxd fai-config/disk_config/HYPERV_GEN2 || hexdump -C fai-config/disk_config/HYPERV_GEN2

      - name: Install Build and Virtualization Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fai-server \
            fai-client \
            fai-setup-storage \
            qemu-utils \
            dosfstools \
            parted \
            gdisk


      - name: Execute FAI Disk Image Builder
        continue-on-error: true
        id: fai-diskimage
        run: |
          # Generate a raw disk file natively mapped to the AArch64 configuration space
          echo "::group::fai-diskimage --help"
          fai-diskimage --help
          echo "::endgroup::"
          
          echo "::group::FAI Bootstrapping and Disk Image Compilation Logs"
          sudo \
            FAI_FLAGS="update" \
            FAI_DEBOOTSTRAP="sid http://deb.debian.org/debian" \
            FAI_DEBOOTSTRAP_OPTS="--arch arm64 --include=apt" \
            fai-diskimage \
            --verbose \
            --size 10G \
            --class DEFAULT,DEBIAN,ARM64,UEFI,CLOUD,HYPERV_GEN2 \
            -s file://${{ github.workspace }}/fai-config \
            output-arm64-gen2.vhdx
          echo "::endgroup::"
            
      - name: Cat Hidden FAI Failure Logs
        if: steps.fai-diskimage.outcome == 'failure'   # Runs ONLY if the step above exits with status 1
        run: |
          echo "=== LOCATING LIVE FAI LOG DIRECTORIES ==="
          # Find any log file created in the last 15 minutes across likely FAI mount paths
          sudo find /var/log/fai/ /tmp/fai/ -type f -name "*.log" -o -name "fai.log" || true
          
          echo "=== DUMPING PRIMARY FAI EXECUTION STREAM ==="
          # Target the fallback live directory using wildcard directory matching
          # tail -n 150
          sudo cat /var/log/fai/*/*/fai.log || sudo tail -n 150 /tmp/fai/fai.log || true
          
          echo "=== DUMPING RECORDED SUB-TASK ERRORS ==="
          # head -n 50
          sudo cat /var/log/fai/*/*/error.log || sudo head -n 50 /tmp/fai/error.log || true

          
      - name: Convert Raw Image to Fixed Hyper-V VHD Format
        if: false
        run: |
          # Hyper-V Gen2 supports VHD and VHDX. 
          # For cross-platform Azure compatibility, convert it to a FIXED-size VHD format.
          qemu-img convert -f raw -O vpc -o subformat=fixed fai-aarch64-raw.img output-arm64-gen2.vhd

      - name: show cwd
        if: always()
        run: |
          ls -la
        
      - name: Upload Finished Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-aarch64-gen2-vhd-${{ github.run_number }}
          path: output-arm64-gen2.vhdx
          if-no-files-found: error
