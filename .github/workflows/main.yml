name: Build Lean Debian Snapdragon X Elite ISO

on:
#  push:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04-arm 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build and Deployment Tools
        run: |
          sudo apt update
          sudo apt install -y debootstrap squashfs-tools xorriso grub-efi-arm64-bin mtools

      # CRITICAL FIX STEP: Sanitize workspace user tracking rules
      - name: Fix Directory Permissions and Ownership
        run: |
          # Enforce root structural properties across the environment to satisfy systemd safety audits
          sudo chown root:root .
          sudo chown root:root ../
          
          sudo mkdir -p iso_root/boot/grub
          sudo mkdir -p iso_root/live
          sudo mkdir -p debian_root
          
          sudo chown -R root:root iso_root debian_root

      - name: Bootstrap Minimal Debian Layer with Target Kernel
        run: |
          # 1. Bootstrap a minimal Debian Sid (Unstable) layer
          sudo debootstrap --components=main,non-free-firmware --variant=minbase sid debian_root https://deb.debian.org/debian/

          # 2. Mount virtual filesystems so apt behaves correctly inside the container
          sudo mount --bind /dev debian_root/dev
          sudo mount --bind /proc debian_root/proc
          sudo mount --bind /sys debian_root/sys

          # 3. Force Debian to download its native ultra-modern ARM64 kernel and firmware
          sudo chroot debian_root /bin/bash -c "
            apt-get update
            apt-get install -y --no-install-recommends linux-image-arm64 firmware-qcom-soc
            
            # Prune background TTY layouts to maximize RAM savings for AI inference
            echo 'id:3:initdefault:' > /etc/inittab
            echo '1:2345:respawn:/sbin/getty 38400 tty1' >> /etc/inittab

            # Optimize kernel memory allocations for matrix/tensor operations
            echo 'vm.swappiness=0' >> /etc/sysctl.conf
            
            echo 'deb-snapdragon' > /etc/hostname
            echo '127.0.0.1 localhost deb-snapdragon' > /etc/hosts
          "
      - name: List files for debugging
        continue-on-error: true
        run: | 
          find debian_root

      - name: Extract DTBs and Clean Up Mountpoints
        run: |
          # 1. Dynamically target the compiled kernel and initrd images inside Debian
          
          KERNEL_IMG=$(ls debian_root/boot/vmlinuz-* | head -n 1 | xargs basename)
          INITRD_IMG=$(ls debian_root/boot/initrd.img-* | head -n 1 | xargs basename)

          sudo cp debian_root/boot/$KERNEL_IMG iso_root/boot/vmlinuz
          sudo cp debian_root/boot/$INITRD_IMG iso_root/boot/initrd

          # 2. Extract and copy all Snapdragon X Elite DTB files to the uncompressed ISO boot layer
          # In native Debian layout, device tree binaries live in /usr/lib/linux-image-<version>/qcom/
          DTB_DIR=$(ls -d debian_root/usr/lib/linux-image-*/qcom 2>/dev/null || ls -d debian_root/lib/firmware/*/device-tree/qcom 2>/dev/null)
          sudo mkdir -p iso_root/boot/dtbs
          sudo cp -r $DTB_DIR/* iso_root/boot/dtbs/

          # 3. Clean up the system mountpoints before filesystem building
          sudo umount debian_root/dev
          sudo umount debian_root/proc
          sudo umount debian_root/sys

      - name: Compress Root System into Live SquashFS
        run: |
          sudo mksquashfs debian_root iso_root/live/filesystem.squashfs -comp xz

      - name: Generate UEFI Boot Loader Configurations
        run: |
          # Generate custom GRUB selections linking explicit X Elite device identifiers
          sudo tee iso_root/boot/grub/grub.cfg <<'EOF' > /dev/null
          insmod part_gpt
          insmod ext2
          set linux_gfx_mode=keep
          
          # Option A: ASUS Vivobook S 15
          menuentry "Debian Live (ASUS Vivobook S 15 - X Elite)" {
              linux /boot/vmlinuz boot=live quiet splash clk_ignore_unused nomodeset
              initrd /boot/initrd
              devicetree /boot/dtbs/x1e80100-asus-vivobook-s15.dtb
          }

          # Option B: Lenovo Yoga Slim 7x
          menuentry "Debian Live (Lenovo Yoga Slim 7x - X Elite)" {
              linux /boot/vmlinuz boot=live quiet splash clk_ignore_unused nomodeset
              initrd /boot/initrd
              devicetree /boot/dtbs/x1e80100-lenovo-yoga-slim7x.dtb
          }

          # Option C: Generic / Reference Snapdragon X Elite Board
          menuentry "Debian Live (Generic Snapdragon X Elite CRD)" {
              linux /boot/vmlinuz boot=live quiet splash clk_ignore_unused nomodeset
              initrd /boot/initrd
              devicetree /boot/dtbs/x1e80100-crd.dtb
          }
          EOF

      - name: Build El Torito EFI Partition Image
        shell: sudo bash {0}
        run: |
          # 1. Create a 32MB fat image outside the main ISO tree temporarily
          dd if=/dev/zero of=efi.img bs=1M count=32
          mkfs.vfat -F 16 efi.img

          mmd -i efi.img ::/EFI
          mmd -i efi.img ::/EFI/BOOT

          # 2. Compile standalone ARM64 GRUB core binary
          grub-mkimage -O arm64-efi -p /boot/grub -o bootaa64.efi part_gpt part_msdos iso9660 udf search normal test linux configfile boot ls echo cat fat efi_gop efi_gop

          # 3. Inject it inside the raw fat efi partition image
          mcopy -i efi.img bootaa64.efi ::/EFI/BOOT/BOOTAA64.EFI

          # 4. CRITICAL FIX: Place a looser matching duplicate copy directly onto the standard filesystem path 
          # This allows standard UEFI stubs to auto-detect the image on flash media without complex partition lookups
          mkdir -p iso_root/EFI/BOOT
          cp bootaa64.efi iso_root/EFI/BOOT/BOOTAA64.EFI
          
          # Move the compiled raw image map straight into the active build environment
          mv efi.img iso_root/boot/efi.img

      # FIXED STEP: Standardized, robust xorriso configuration layout
      - name: Create Bootable UEFI ISO Image
        shell: sudo bash {0}
        run: |
          xorriso -as mkisofs \
            -R -J -joliet-long \
            -iso-level 3 \
            -append_partition 2 0xef iso_root/boot/efi.img \
            -eltorito-alt-boot \
            -e boot/efi.img \
            -no-emul-boot \
            -o debian-x1elite-minimal.iso \
            iso_root/
            
          sudo find *.iso
          sudo chmod o+rwx debian-x1elite-minimal.iso

      - name: Upload Finished Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:          
          name: debian-x1elite-minimal-${{ github.run_number }}
          path: debian-x1elite-minimal.iso
