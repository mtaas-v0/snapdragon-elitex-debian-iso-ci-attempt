name: Build Lean Debian Snapdragon X Elite ISO

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-iso:
    # Leverages GitHub's native 64-bit ARM Linux runners
    runs-on: ubuntu-24.04-arm 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build and Deployment Tools
        run: |
          sudo apt update
          sudo apt install -y debootstrap squashfs-tools xorriso grub-efi-arm64-bin mtools 
          # mdtadm?
          
      - name: Create Structure and Download Snapdragon Kernel Blobs
        run: |
          # 1. Set up build workspace directories
          mkdir -p iso_root/boot/grub
          mkdir -p iso_root/live
          mkdir -p debian_root

          # 2. Add the Ubuntu Qualcomm Concept PPA to grab the specialized X Elite kernel
          sudo add-apt-repository -y ppa:canonical-kernel-team/ppa
          sudo apt update
          
          # 3. Download the specific Snapdragon laptop kernel and firmware packages
          apt-get download linux-image-generic-wip-uspt linux-modules-generic-wip-uspt linux-firmware

      - name: Bootstrap Minimal Debian Layer
        run: |
          # Deploy a clean, minimal Debian Sid/Unstable layer (best for cutting-edge ARM laptops)
          sudo debootstrap --variant=minbase sid debian_root http://debian.org

          # Move downloaded Snapdragon kernel/firmware packages inside the chroot environment
          sudo mv *.deb debian_root/tmp/

      - name: Configure Lean Debian Environment and Install Kernel
        run: |
          sudo mount --bind /dev debian_root/dev
          sudo mount --bind /proc debian_root/proc
          sudo mount --bind /sys debian_root/sys

          # Run internal configurations to keep the OS slim
          sudo chroot debian_root /bin/bash -c "
            # Install the specific Snapdragon kernel hardware blobs
            dpkg -i /tmp/*.deb || apt-get install -f -y
            rm -f /tmp/*.deb

            # Remove unwanted terminal/tty processes to preserve RAM
            echo 'id:3:initdefault:' > /etc/inittab
            echo '1:2345:respawn:/sbin/getty 38400 tty1' >> /etc/inittab

            # Optimize memory behavior for local AI inference workload
            echo 'vm.swappiness=0' >> /etc/sysctl.conf
            
            # Configure absolute basic networking
            echo 'deb-snapdragon' > /etc/hostname
            echo '127.0.0.1 localhost deb-snapdragon' > /etc/hosts
          "
          
          sudo umount debian_root/dev debian_root/proc debian_root/sys

      - name: Compress Root System into Live SquashFS
        run: |
          # Compress your optimized Debian setup into the read-only live filesystem container
          sudo mksquashfs debian_root iso_root/live/filesystem.squashfs -comp xz

      - name: Generate UEFI Boot Loader Configurations
        run: |
          # Dynamically capture the generated kernel and initrd file names from the root build
          KERNEL_IMG=$(ls debian_root/boot/vmlinuz-* | head -n 1 | xargs basename)
          INITRD_IMG=$(ls debian_root/boot/initrd.img-* | head -n 1 | xargs basename)

          # Copy the actual kernel images out to the public boot path on the ISO
          sudo cp debian_root/boot/$KERNEL_IMG iso_root/boot/vmlinuz
          sudo cp debian_root/boot/$INITRD_IMG iso_root/boot/initrd

          # Generate the GRUB menu configuration file targeting Snapdragon initialization parameters
          cat <<EOF > iso_root/boot/grub/grub.cfg
          insmod part_gpt
          insmod ext2
          set linux_gfx_mode=keep
          
          menuentry "Minimal Debian (Snapdragon X Elite Live - Max RAM)" {
              # Pass specific Qualcomm driver management arguments to prevent device hanging
              linux /boot/vmlinuz boot=live quiet splash clk_ignore_unused nomodeset
              initrd /boot/initrd
          }
          EOF

      - name: Create Bootable ISO Image
        run: |
          # Build a compliant UEFI ISO image that the Oryon architecture can interpret natively
          xorriso -as mkisofs \
            -R -J -joliet-long \
            -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e --interval:appended_partition_only:2 \
            -no-emul-boot \
            -o debian-x1 elite-minimal.iso \
            iso_root/

      - name: Upload Finished Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-debian-iso
          path: debian-x1elite-minimal.iso
